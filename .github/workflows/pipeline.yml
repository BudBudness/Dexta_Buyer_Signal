name: Dexta Buyer Pipeline

# Automatic discovery stays disabled until an approved provider and private
# evidence store are configured and verified.
on:
  workflow_dispatch:
    inputs:
      confirm_authorized_sources:
        description: "Confirm every enabled source has documented authorization and permission."
        required: true
        type: boolean
        default: false
      confirm_private_storage:
        description: "Confirm private evidence storage and access controls are verified."
        required: true
        type: boolean
        default: false

concurrency:
  group: dexta-authorized-discovery
  cancel-in-progress: false

jobs:
  intelligence:
    if: ${{ inputs.confirm_authorized_sources == true && inputs.confirm_private_storage == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/engine
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r engine/requirements.txt
      - run: pytest -q engine/tests
      - name: Discover authorized public sources
        env:
          DEXTA_SOURCE_REGISTRY: ${{ vars.DEXTA_SOURCE_REGISTRY }}
        run: |
          if [ -n "$DEXTA_SOURCE_REGISTRY" ]; then
            umask 077
            export DEXTA_SOURCE_REGISTRY_PATH="$RUNNER_TEMP/dexta-sources.json"
            printf '%s' "$DEXTA_SOURCE_REGISTRY" > "$DEXTA_SOURCE_REGISTRY_PATH"
          fi
          python engine/run_discovery.py
      - run: python engine/run_pipeline.py
