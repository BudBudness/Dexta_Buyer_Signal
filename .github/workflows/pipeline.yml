name: Dexta Buyer Pipeline

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  intelligence:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/engine
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r engine/requirements.txt
      - run: pytest -q engine/tests
      - name: Discover authorized public sources
        env:
          DEXTA_SOURCE_REGISTRY: ${{ vars.DEXTA_SOURCE_REGISTRY }}
        run: |
          if [ -n "$DEXTA_SOURCE_REGISTRY" ]; then
            umask 077
            export DEXTA_SOURCE_REGISTRY_PATH="$RUNNER_TEMP/dexta-sources.json"
            printf '%s' "$DEXTA_SOURCE_REGISTRY" > "$DEXTA_SOURCE_REGISTRY_PATH"
          fi
          python engine/run_discovery.py
      - run: python engine/run_pipeline.py
