name: Dexta Intelligence

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r engine/requirements.txt
      - run: pytest -q engine/tests
