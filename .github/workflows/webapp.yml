name: Dexta Web App Verification

on:
  pull_request:
    paths:
      - "webapp/**"
      - ".github/workflows/webapp.yml"
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dexta-webapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout PR branch or target ref
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Refresh lockfile for approved dependency floors
        id: lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run web application tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Commit verified lockfile update to same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.lockfile.outputs.changed == 'true'
        working-directory: .
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/package-lock.json
          git commit -m "fix(deps): lock audited package versions"
          git push origin "HEAD:$BRANCH_NAME"
      - name: Export verified dependency manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dexta-verified-dependency-manifests
          path: |
            webapp/package.json
            webapp/package-lock.json
          if-no-files-found: error
